components:
  schemas:
    BaseErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          default: false
        error:
          $ref: '#/components/schemas/ErrorDetail'
        request_id:
          type: string
          format: uuid
          description: ID da requisição para rastreamento.
      required:
      - error
    BlankEnum:
      enum:
      - ''
    CareTypesInputEnum:
      enum:
      - HOME
      - HOSPITAL
      - NIGHT_SHIFT
      - DAY_SHIFT
      - COMPANION
      type: string
      description: |-
        * `HOME` - Domiciliar
        * `HOSPITAL` - Hospitalar
        * `NIGHT_SHIFT` - Plantão noturno
        * `DAY_SHIFT` - Plantão diurno
        * `COMPANION` - Acompanhante
    CaregiverElderLink:
      type: object
      description: |-
        Serializer do vínculo Caregiver ↔ Elder.

        Segurança:
        - caregiver é read_only e vem do usuário logado (CaregiverProfile).
      properties:
        id:
          type: integer
          readOnly: true
        caregiver:
          type: integer
          readOnly: true
        elder:
          type: integer
        status:
          $ref: '#/components/schemas/Status344Enum'
        started_at:
          type: string
          format: date
          nullable: true
          title: Início
        ended_at:
          type: string
          format: date
          nullable: true
          title: Fim
        agreed_hourly_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
          title: Valor/hora acordado
          description: Snapshot do valor combinado no vínculo (pode diferir do perfil).
        notes:
          type: string
          title: Observações
        is_active:
          type: boolean
          default: true
          title: Vínculo ativo
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Criado em
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Atualizado em
      required:
      - caregiver
      - created_at
      - elder
      - id
      - updated_at
    CaregiverElderLinkRequest:
      type: object
      description: |-
        Serializer do vínculo Caregiver ↔ Elder.

        Segurança:
        - caregiver é read_only e vem do usuário logado (CaregiverProfile).
      properties:
        elder:
          type: integer
        status:
          $ref: '#/components/schemas/Status344Enum'
        started_at:
          type: string
          format: date
          nullable: true
          title: Início
        ended_at:
          type: string
          format: date
          nullable: true
          title: Fim
        agreed_hourly_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
          title: Valor/hora acordado
          description: Snapshot do valor combinado no vínculo (pode diferir do perfil).
        notes:
          type: string
          title: Observações
        is_active:
          type: boolean
          default: true
          title: Vínculo ativo
      required:
      - elder
    CaregiverMe:
      type: object
      description: |-
        Atualização do próprio perfil de cuidador.

        Abordagem 1:
        - care_types (read): devolve a lista de tipos cadastrados para o cuidador
        - care_types_input (write): recebe a lista de tipos para sincronizar no banco
      properties:
        bio:
          type: string
          title: Biografia
        experience_years:
          type: integer
          maximum: 32767
          minimum: 0
          title: Anos de experiência
        is_available:
          type: boolean
          title: Disponível para contratação
        city:
          type: string
          title: Cidade
          maxLength: 120
        state:
          type: string
          title: Estado
          maxLength: 2
        care_types:
          type: string
          readOnly: true
          description: Lista de tipos de atendimento que o cuidador realiza.
      required:
      - care_types
    CaregiverMeRequest:
      type: object
      description: |-
        Atualização do próprio perfil de cuidador.

        Abordagem 1:
        - care_types (read): devolve a lista de tipos cadastrados para o cuidador
        - care_types_input (write): recebe a lista de tipos para sincronizar no banco
      properties:
        bio:
          type: string
          title: Biografia
        experience_years:
          type: integer
          maximum: 32767
          minimum: 0
          title: Anos de experiência
        is_available:
          type: boolean
          title: Disponível para contratação
        city:
          type: string
          title: Cidade
          maxLength: 120
        state:
          type: string
          title: Estado
          maxLength: 2
        care_types_input:
          type: array
          items:
            $ref: '#/components/schemas/CareTypesInputEnum'
          writeOnly: true
          description: Lista de tipos de atendimento para salvar no perfil (substitui
            o conjunto atual).
    CognitiveStatusEnum:
      enum:
      - LUCID
      - MILD_IMPAIRMENT
      - DEMENTIA
      - NOT_INFORMED
      type: string
      description: |-
        * `LUCID` - Lúcido(a)
        * `MILD_IMPAIRMENT` - Comprometimento leve
        * `DEMENTIA` - Demência
        * `NOT_INFORMED` - Não informado
    ElderMe:
      type: object
      description: Serializer para o próprio idoso atualizar seu perfil.
      properties:
        preferred_name:
          type: string
          title: Nome social/preferido
          maxLength: 150
        birth_date:
          type: string
          format: date
          nullable: true
          title: Data de nascimento
        gender:
          allOf:
          - $ref: '#/components/schemas/GenderEnum'
          title: Gênero
        mobility_level:
          allOf:
          - $ref: '#/components/schemas/MobilityLevelEnum'
          title: Mobilidade
        cognitive_status:
          allOf:
          - $ref: '#/components/schemas/CognitiveStatusEnum'
          title: Condição cognitiva
        has_fall_risk:
          type: boolean
          title: Risco de quedas
        needs_medication_support:
          type: boolean
          title: Precisa de ajuda com medicação
        requires_24h_care:
          type: boolean
