  /api/v1/health/:
    get:
      operationId: v1_health_retrieve
      description: Endpoint público para o frontend (ou monitoramento) verificar se
        a API está ativa. Não exige autenticação.
      summary: Health check da API
      tags:
      - Health
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: ok
                      message:
                        type: string
                        example: API de rede de cuidados ativa
                    required:
                    - status
                    - message
                required:
                - success
                - data
          description: API ativa
