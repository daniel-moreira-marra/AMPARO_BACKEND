  /api/v1/posts/feed/:
    get:
      operationId: v1_posts_feed_list
      description: |-
        Lista postagens publicadas visíveis ao usuário.

        **Regras de Negócio:**
        - Apenas postagens com status `published` são retornadas.
        - A visibilidade respeita o escopo configurado pelo autor.
        - O feed é cacheado por 60 segundos por usuário/página.

        **Paginação:**
        - Usa `CursorPagination` por padrão (parâmetro `cursor`).
        - Suporta fallback para paginação por página caso o parâmetro `page` seja informado.
      summary: Listar feed geral
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
        description: Token do cursor para a próxima página de resultados.
      - in: query
        name: page
        schema:
          type: integer
        description: Número da página (ativa modo de paginação tradicional).
      tags:
      - Posts
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FeedPostSuccessResponse'
              examples:
                RespostaDoFeed:
                  value:
                  - success: true
                    data:
                      next: http://api.exemplo.com/api/v1/posts/feed/?cursor=cD0yMDI0LTAyLTAz
                      previous: null
                      results:
                      - id: 1
                        author_name: João Silva
                        text: Olá mundo!
                        likes_count: 5
                        created_at: '2024-02-03T10:00:00Z'
                  summary: Resposta do Feed
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseErrorResponse'
              examples:
                NãoAutenticado:
                  value:
                    success: false
                    error:
                      code: not_authenticated
                      message: As credenciais de autenticação não foram fornecidas.
                      details: null
                  summary: Não Autenticado
          description: Autenticação necessária ou inválida.
